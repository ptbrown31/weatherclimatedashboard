<head>

<title>Weather prediction markets, station by station</title>
<meta name="description" content="Live ForecastEx weather prediction market prices at every listed US temperature station, each dot showing the market-implied median against the National Weather Service forecast for the day.">

<body>
<div class="wrap">
<h1 id="mapTitle">US daily temperature stations</h1>
<div class="bar modegrid">
  <div class="mgcol"><span class="mgh">Today</span>
    <button id="m1">Highs</button>
    <button id="m3">Lows</button>
  </div>
  <div class="mgcol"><span class="mgh">Tomorrow</span>
    <button id="m2">Highs</button>
    <button id="m4">Lows</button>
  </div>
  <span id="pageStatus"></span>
</div>
<div class="card"><svg id="map" viewBox="0 0 960 600"></svg></div>
<div class="key" id="legend"></div>
<p class="cap" id="dotKey" style="margin:8px 0 10px"><span class="chip" style="background:var(--warm)"></span>running warmer <span class="chip" style="background:var(--cool)"></span>running cooler</p>
<div class="pickttl" style="margin-top:14px">INTERNATIONAL STATIONS AND HONOLULU</div>
<div class="card"><svg id="mapW" viewBox="0 60 960 320"></svg></div>
<div class="secttl" style="margin-top:26px">FORECAST SCORECARD</div>
<div class="bar" id="divControls"><span id="scoreStatus"></span></div>
<div id="divTitle" class="secttl"></div>
<div class="card"><div id="divergence"></div></div>
<div class="key" id="divKey"></div>
<p class="cap" id="divCap"></p>

<p class="cap">How each tool has scored over the last two weeks is on <a href="accuracy.html">the accuracy page</a>.</p>

<p class="cap" style="margin-top:26px"><a href="daily-temperature-markets.html">Daily temperature markets at ForecastEx &rarr;</a></p>


</div>

</body>
